name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      # --locked asserts uv.lock is in sync with pyproject.toml and fails the
      # build if they have diverged, so a floor bump without a matching
      # `uv lock` cannot go unnoticed — which is exactly how the stale
      # mcp>=1.2 floor hid previously. (--frozen would not catch this: it
      # syncs from whatever the lock already says without checking it against
      # pyproject at all.)
      - run: uv sync --locked --all-extras
      - run: uv run pytest -v

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t coderoot-repo-assessor:ci .
      # Fail-closed must hold in the built image, not only in unit tests. Bounded
      # and asserted on the message, not just the exit code: uvicorn is a
      # long-lived foreground server, so if fail-closed ever regressed and the
      # container started, a bare `docker run` (no -d) would never return —
      # the step would eventually fail via the job's multi-hour default
      # timeout instead of failing fast with a legible reason. This must
      # distinguish three outcomes: refused for the right reason (pass),
      # started successfully (fail fast), still running at the timeout (fail
      # fast) — asserting on the exit code alone would let a container that
      # exits 1 for an unrelated reason read as success.
      - name: assert the image refuses to start unauthenticated
        run: |
          set +e
          timeout 30s docker run --rm coderoot-repo-assessor:ci > out.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "FAIL: image was still running after 30s — it started without auth configured"
            cat out.log; exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "FAIL: image started successfully with no auth configured"
            cat out.log; exit 1
          fi
          grep -q "refusing to start unauthenticated" out.log || {
            echo "FAIL: exited non-zero but not for the fail-closed reason"; cat out.log; exit 1; }
          echo "OK: refused to start, exit=$code"

      # Publish the (already-built, fail-closed-verified) image to GHCR so it can be
      # pulled and run locally: `docker pull ghcr.io/settletop-inc/coderoot-repo-assessor`.
      # Only on main (-> :latest + :sha-<short>) and release tags (-> :vX.Y.Z);
      # PRs and feature branches build + test only, never push.
      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          image=$(echo "ghcr.io/${{ github.repository_owner }}/coderoot-repo-assessor" | tr '[:upper:]' '[:lower:]')
          push() { docker tag coderoot-repo-assessor:ci "$image:$1"; docker push "$image:$1"; echo "pushed $image:$1"; }
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            push latest
            push "sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            push "${{ github.ref_name }}"
          fi
