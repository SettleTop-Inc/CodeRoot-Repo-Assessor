[project]
name = "coderoot-repo-assessor"
version = "0.1.0"
description = "Classify a source repository as an agent, MCP server, skill or prompt — with evidence."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
coderoot-repo-assessor-mcp = "assessor.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assessor"]

[tool.pytest.ini_options]
markers = [
    "network: reaches the public internet (set ASSESSOR_NETWORK_TEST=1)",
    "corpus: requires a CodeRoot corpus export (set ASSESSOR_CORPUS_DIR)",
]
testpaths = ["tests"]
